services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fluxyr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxyr}
      POSTGRES_DB: fluxyr_agent
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxyr -d fluxyr_agent"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  agent:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://fluxyr:${POSTGRES_PASSWORD:-fluxyr}@postgres:5432/fluxyr_agent
      FLUXYR_PROVIDER: ${FLUXYR_PROVIDER:-openrouter}
      FLUXYR_MODEL: ${FLUXYR_MODEL:-}
      FLUXYR_AGENT_NAME: ${FLUXYR_AGENT_NAME:-Default Agent}
      PORT: ${PORT:-5050}
      FLUXYR_WORKERS: ${FLUXYR_WORKERS:-4}
      FLUXYR_TOOL_WORKERS: ${FLUXYR_TOOL_WORKERS:-6}
      FLUXYR_SKILLS_DIR: ${FLUXYR_SKILLS_DIR:-}
      FLUXYR_LEASE_SECONDS: ${FLUXYR_LEASE_SECONDS:-90}
      FLUXYR_TOOL_TIMEOUT: ${FLUXYR_TOOL_TIMEOUT:-300}
      FLUXYR_BASH_MAX_OUTPUT_BYTES: ${FLUXYR_BASH_MAX_OUTPUT_BYTES:-33554432}
      FLUXYR_EXECUTION_MODE: ${FLUXYR_EXECUTION_MODE:-local}
      FLUXYR_WORKSPACE_RETENTION_DAYS: ${FLUXYR_WORKSPACE_RETENTION_DAYS:-30}
      FLUXYR_MAX_ITERATIONS: ${FLUXYR_MAX_ITERATIONS:-40}
      FLUXYR_HTTP_THREADS: ${FLUXYR_HTTP_THREADS:-24}
      FLUXYR_MAX_CONTENT_LENGTH: ${FLUXYR_MAX_CONTENT_LENGTH:-4194304}
      FLUXYR_PROVIDER_ENDPOINT: ${FLUXYR_PROVIDER_ENDPOINT:-}
      FLUXYR_PROVIDER_FORMAT: ${FLUXYR_PROVIDER_FORMAT:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      FLUXYR_MAX_TOKENS: ${FLUXYR_MAX_TOKENS:-16000}
      FLUXYR_REASONING_EFFORT: ${FLUXYR_REASONING_EFFORT:-}
      FLUXYR_THINKING_MODE: ${FLUXYR_THINKING_MODE:-none}
      FLUXYR_THINKING_BUDGET: ${FLUXYR_THINKING_BUDGET:-0}
      FLUXYR_LOG_LEVEL: ${FLUXYR_LOG_LEVEL:-INFO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
    ports:
      - "${FLUXYR_BIND:-127.0.0.1}:${PORT:-5050}:${PORT:-5050}"
    volumes:
      - agent:/var/lib/fluxyr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 180s
volumes:
  postgres:
  agent:
