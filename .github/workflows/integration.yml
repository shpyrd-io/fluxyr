name: Full integration tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium · Docker · private input and OTP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the optional browser image
        run: docker build --target browser -t fluxyr-browser-test .
      - name: Exercise the installed package and private-input UI in Chromium
        run: |
          docker run --rm --init --shm-size=512m \
            -v "$GITHUB_WORKSPACE/tests:/checks/tests:ro" \
            -e FLUXYR_TEST_BROWSER=1 \
            --entrypoint sh fluxyr-browser-test -c '
              python -m pip install --quiet --target /tmp/browser-tests "pytest>=7.4,<9" &&
              PYTHONPATH=/tmp/browser-tests:/checks/tests python -m pytest -q -m integration \
                -o cache_dir=/tmp/pytest-cache -o markers=integration /checks/tests/test_browser_chrome.py
            '
  integration:
    name: Python ${{ matrix.python }} · PostgreSQL · full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxyr
          POSTGRES_PASSWORD: fluxyr
          POSTGRES_DB: fluxyr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fluxyr -d fluxyr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://fluxyr:fluxyr@localhost:5432/fluxyr_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: python -m pip install -e '.[test]'
      - run: pytest -q -m '' --durations=15
